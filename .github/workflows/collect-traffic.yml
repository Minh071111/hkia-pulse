name: Collect HKIA Traffic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect TDAS traffic data
        shell: python
        run: |
          import json
          import csv
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          API = "https://tdas-api.hkemobility.gov.hk/tdas/api/route"

          PO_LAM = {
              "lat": 22.3224,
              "long": 114.2579,
              "buffer": 600
          }

          HKIA = {
              "lat": 22.3159,
              "long": 113.9360,
              "buffer": 1200
          }

          def call_tdas(start, end):
              body = {
                  "start": start,
                  "end": end,
                  "departIn": 0,
                  "lang": "tc",
                  "type": "ST"
              }

              req = urllib.request.Request(
                  API,
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "HKIA-Pulse/1.0"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def eta_minutes(eta):
              if not eta:
                  return None

              h, m = eta.split(":")
              return int(h) * 60 + int(m)

          def numeric_speed(value):
              if not value:
                  return None

              text = "".join(
                  c for c in str(value)
                  if c.isdigit() or c == "."
              )

              return float(text) if text else None

          def numeric_distance(value, fallback_m=None):
              if value:
                  text = "".join(
                      c for c in str(value)
                      if c.isdigit() or c == "."
                  )

                  if text:
                      return float(text)

              if fallback_m is not None:
                  return round(float(fallback_m) / 1000, 2)

              return None

          now = datetime.now(ZoneInfo("Asia/Hong_Kong"))
          timestamp = now.isoformat(timespec="seconds")

          outbound = call_tdas(PO_LAM, HKIA)
          inbound = call_tdas(HKIA, PO_LAM)

          latest = {
              "status": "ok",
              "updated": timestamp,
              "outbound": {
                  "eta_min": eta_minutes(outbound.get("eta")),
                  "avg_speed_kmh": numeric_speed(
                      outbound.get("jSpeed")
                  ),
                  "distance_km": numeric_distance(
                      outbound.get("distU"),
                      outbound.get("distM")
                  ),
                  "eta_raw": outbound.get("eta")
              },
              "inbound": {
                  "eta_min": eta_minutes(inbound.get("eta")),
                  "avg_speed_kmh": numeric_speed(
                      inbound.get("jSpeed")
                  ),
                  "distance_km": numeric_distance(
                      inbound.get("distU"),
                      inbound.get("distM")
                  ),
                  "eta_raw": inbound.get("eta")
              }
          }

          latest_dir = Path("latest")
          latest_dir.mkdir(parents=True, exist_ok=True)

          with open(
              latest_dir / "traffic.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  latest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          history_dir = Path("history/traffic")
          history_dir.mkdir(parents=True, exist_ok=True)

          history_file = history_dir / f"{now:%Y-%m}.csv"

          header = [
              "timestamp",
              "direction",
              "eta_min",
              "avg_speed_kmh",
              "distance_km"
          ]

          rows = [
              [
                  timestamp,
                  "outbound",
                  latest["outbound"]["eta_min"],
                  latest["outbound"]["avg_speed_kmh"],
                  latest["outbound"]["distance_km"]
              ],
              [
                  timestamp,
                  "inbound",
                  latest["inbound"]["eta_min"],
                  latest["inbound"]["avg_speed_kmh"],
                  latest["inbound"]["distance_km"]
              ]
          ]

          new_file = not history_file.exists()

          with open(
              history_file,
              "a",
              encoding="utf-8",
              newline=""
          ) as f:
              writer = csv.writer(f)

              if new_file:
                  writer.writerow(header)

              writer.writerows(rows)

          print(json.dumps(latest, ensure_ascii=False, indent=2))

      - name: Commit traffic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest/traffic.json history/traffic/

          if git diff --cached --quiet; then
            echo "No traffic data changes."
            exit 0
          fi

          git commit -m "Update traffic data"
          git push
