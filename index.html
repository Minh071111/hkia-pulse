function csvMap(t){const L=t.replace(/^\uFEFF/,'').trim().split(/\r?\n/),h=L.shift().split(',').map(x=>x.trim()),ii=h.findIndex(x=>x.toLowerCase()==='irn_id'),ri=h.findIndex(x=>x.toLowerCase()==='ucase(route)'),m=new Map();L.forEach(l=>{const c=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(c[ii])m.set(c[ii],(c[ri]||'').toUpperCase())});return m}function speedMap(t){const x=new DOMParser().parseFromString(t,'application/xml'),m=new Map();x.querySelectorAll('segment').forEach(e=>{const id=e.querySelector('segment_id')?.textContent?.trim(),v=Number(e.querySelector('speed')?.textContent),ok=(e.querySelector('valid')?.textContent||'Y').trim();if(id&&Number.isFinite(v)&&ok!=='N')m.set(id,v)});return m}function seq(d){let a=[];(d.route||[]).forEach(r=>(r.segment||[]).forEach(g=>(g.rid||[]).forEach(id=>a.push({rid:String(id),dir:g.dir}))));return a}
function alloc(a,c){const e=a.map(x=>({...x,route:c.get(x.rid)||''})),g=new Map(),add=(n,x)=>{if(!g.has(n))g.set(n,[]);g.get(n).push(x)},r7=e.filter(x=>x.route==='7'),r3=e.filter(x=>x.route==='3'),r8=e.filter(x=>x.route==='8'),s7=Math.max(1,Math.round(r7.length*.35)),s3=Math.max(1,Math.round(r3.length*.60)),s8=Math.max(1,Math.round(r8.length*.28));e.forEach(x=>{let n=null;if(/PO HONG ROAD|TSEUNG KWAN O TUNNEL ROAD/.test(x.route))n='將軍澳隧道';else if(x.route==='7')n=r7.indexOf(x)<s7?'將軍澳隧道':'觀塘繞道';else if(x.route==='2'||x.route==='5')n='中九龍繞道／九龍接駁';else if(x.route==='3')n=r3.indexOf(x)<s3?'西九龍公路':'青葵／長青';else if(x.route==='8')n=r8.indexOf(x)<s8?'青馬／青嶼幹線':'北大嶼山公路';else if(/AIRPORT ROAD|CHEONG HONG ROAD/.test(x.route))n='北大嶼山公路';if(n)add(n,x)});return g}
function renderSeg(){const p=document.getElementById('segHealthPanel'),names=direction==='out'?SEGOUT:SEGBACK;p.innerHTML=names.map(n=>{const d=segData.find(x=>x.name===n)||{},cov=d.total?d.matched/d.total:0,h=cov<.3?['segGrey','--']:hc(d.speed),v=cov<.3?'--':Math.round(d.speed)+' km/h · '+h[1];return '<div class="segHealthRow"><span>'+n+'</span><span class="segHealthStatus"><span class="segDot '+h[0]+'"></span>'+v+'</span></div>'}).join('')}function toggleSegHealth(){segOpen=!segOpen;segHealthPanel.classList.toggle('open',segOpen);segHealthBtn.textContent=segOpen?'收起路段詳情 ▲':'展開路段詳情 ▼'}
async function loadSeg(d){try{const[cr,sr]=await Promise.all([fetch(CAT,{cache:'no-store'}),fetch(SPD,{cache:'no-store'})]),c=csvMap(await cr.text()),sm=speedMap(await sr.text()),a=seq(d),g=alloc(a,c),names=direction==='out'?SEGOUT:SEGBACK;segData=names.map(name=>{const rows=g.get(name)||[],vals=rows.map(x=>sm.get(x.rid)).filter(Number.isFinite);return{name,total:rows.length,matched:vals.length,speed:vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null}});renderSeg();const good=segData.filter(x=>Number.isFinite(x.speed)&&x.total&&x.matched/x.total>=.3);if(good.length){const slow=good.reduce((a,b)=>a.speed<=b.speed?a:b),h=hc(slow.speed);bottleneckBox.classList.add('show');bottleneckValue.innerHTML='<span class="segDot '+h[0]+'"></span>'+slow.name+' · '+Math.round(slow.speed)+' km/h · '+h[1]}else bottleneckBox.classList.remove('show')}catch(e){segData=[];renderSeg();bottleneckBox.classList.remove('show')}}
async function testTDAS(){tdasStatus.textContent='連線中…';const out=direction==='out',body={start:out?PTS.poLam:PTS.hkia,end:out?PTS.hkia:PTS.poLam,departIn:0,lang:'tc',type:'ST'};try{const r=await fetch(TDAS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json(),p=String(d.eta||'').split(':').map(Number),mins=p.length===2?p[0]*60+p[1]:null;tdasStatus.textContent='TDAS ● LIVE · '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false});tdasStatus.className='tdasStatus ok';etaValue.textContent=mins!=null?mins+' 分鐘':'--';arrivalValue.textContent=mins!=null?new Date(Date.now()+mins*60000).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'--:--';speedValue.textContent=d.jSpeed||'--';distanceValue.textContent=d.distU||'--';const v=parseFloat(String(d.jSpeed||'').replace(/[^0-9.]/g,'')),h=v>=60?['green','暢順']:v>=40?['amber','一般']:['red','較慢'];healthValue.innerHTML='<span class="healthDot '+h[0]+'"></span>'+h[1];await loadSeg(d)}catch(e){tdasStatus.textContent='TDAS ● FAILED';tdasStatus.className='tdasStatus bad'}}
const STN_URL='https://www.td.gov.hk/en/special_news/trafficnews.xml',STN_DISTRICTS=new Set(['Sai Kung','Kwun Tong','Kowloon City','Yau Tsim Mong','Sham Shui Po','Kwai Tsing','Tsuen Wan','Islands']);const STN_GROUPS=[['將軍澳隧道',['將軍澳隧道','將軍澳道','tseung kwan o tunnel','tseung kwan o road']],['觀塘繞道',['觀塘繞道','kwun tong bypass','啟祥道','kai cheung road']],['中九龍繞道',['中九龍繞道','中九龍幹線','central kowloon route','central kowloon bypass','啟德交匯處','kai tak interchange','油麻地交匯處','yau ma tei interchange']],['西九龍公路',['西九龍公路','west kowloon highway','連翔道','lin cheung road']],['青葵／長青',['青葵公路','tsing kwai highway','長青公路','cheung tsing highway','長青隧道','cheung tsing tunnel']],['青馬／青嶼幹線',['青馬大橋','tsing ma bridge','汲水門大橋','汲水門橋','kap shui mun bridge','青嶼幹線','lantau link']],['北大嶼山公路',['北大嶼山公路','north lantau highway','欣澳','sunny bay','小蠔灣','siu ho wan','東涌','tung chung']],['機場',['機場路','airport road','暢航路','cheong hong road','香港國際機場','hong kong international airport']]];const CORE=['青馬大橋','西九龍公路','北大嶼山公路','將軍澳隧道','觀塘繞道','中九龍繞道','tsing ma bridge','west kowloon highway','north lantau highway','tseung kwan o tunnel','kwun tong bypass','central kowloon route'],HIGH=['交通意外','意外','封閉','全線封閉','道路封閉','行車線封閉','嚴重擠塞','accident','closed','closure','lane closure','serious congestion'];function lx(e,n){for(const x of e.getElementsByTagName('*'))if((x.localName||x.nodeName.split(':').pop()).toLowerCase()===n.toLowerCase())return(x.textContent||'').trim();return''}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rel(m){const chin=lx(m,'ChinText'),cs=lx(m,'ChinShort'),eng=lx(m,'EngText'),es=lx(m,'EngShort'),text=[chin,cs,eng,es].join(' '),t=text.toLowerCase(),ds=[...m.getElementsByTagName('*')].filter(x=>(x.localName||x.nodeName.split(':').pop()).toLowerCase()==='district').map(x=>(x.textContent||'').trim()),dok=ds.some(d=>STN_DISTRICTS.has(d));let group=null;for(const[n,ks]of STN_GROUPS)if(ks.some(k=>t.includes(k.toLowerCase()))){group=n;break}const core=CORE.some(k=>t.includes(k.toLowerCase()));if(!group||(!dok&&!core))return null;return{group,date:lx(m,'ReferenceDate'),short:cs||es||chin||eng,long:chin||eng,ds,high:HIGH.some(k=>t.includes(k.toLowerCase()))}}
function toggleSTN(i){document.getElementById(i)?.classList.toggle('open')}async function loadSTN(){try{const r=await fetch(STN_URL,{cache:'no-store'}),x=new DOMParser().parseFromString(await r.text(),'application/xml'),msgs=[...x.getElementsByTagName('*')].filter(e=>(e.localName||e.nodeName.split(':').pop()).toLowerCase()==='message'),hits=msgs.map(rel).filter(Boolean);stnStatus.textContent=hits.length+' relevant · '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false});stnList.innerHTML=hits.length?hits.map((v,i)=>'<div class="stnItem '+(v.high?'high':'')+'"><div class="stnRoad">'+(v.high?'🔴 ':'🟡 ')+esc(v.group)+'</div><div class="stnShort">'+esc(v.short)+'</div><div class="stnMeta">'+esc(v.date)+(v.ds.length?' · '+esc(v.ds.join(', ')):'')+'</div><button class="miniBtn" onclick="toggleSTN(\'stn'+i+'\')">政府原文 ▼</button><div class="stnDetails" id="stn'+i+'">'+esc(v.long)+'</div></div>').join(''):'<div class="stnEmpty">目前沒有匹配 Po Lam ↔ HKIA 路線的 Special Traffic News。</div>'}catch(e){stnStatus.textContent='Unavailable';stnList.innerHTML='<div class="stnEmpty">Special Traffic News 暫時未能讀取；其他功能不受影響。</div>'}}
